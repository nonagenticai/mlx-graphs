name: Secret scan

# Runs gitleaks over the commits a PR actually adds, using the fleet's shared
# composite action so the rules and the pinned scanner version live in ONE place
# (nonagenticai/gitops-production/.github/actions/secret-scan).
#
# WHY THIS FILE EXISTS
#   Measured 2026-08-24 across all 159 repos with a remote: 154 were covered by a
#   secret scan in CI -- 29 directly, 125 through a gitops archetype. THIS REPO WAS
#   ONE OF THE FIVE THAT WERE NOT. It runs a hand-rolled ci.yaml (or, for two of
#   the five, no workflows at all) and so never inherited the archetype's scan.
#
#   The local pre-commit/pre-push gate does cover this repo, but that only protects
#   the one machine the hooks are installed on. CI is what protects the REPO.
#
# ⛔ NO `if:` ON THE JOB. A conditional on a security gate is how a scan becomes
# permanently inert while still reporting green; the archetypes' own test suite
# forbids it outright for the same reason.
#
# runs-on: ubuntu-latest, NOT arc-amd64 -- deliberately. The action pins gitleaks
# 8.30.1 by sha256 from the public GitHub release and needs nothing from the
# internal fleet (no registry.internal, no self-hosted-only tooling), and this
# repo's existing CI already runs on GitHub-hosted runners. Keeping it there means
# this scan adds no load to the arc-amd64 pool, which sits at or near its
# maxRunners ceiling for hours a day.
#
# fetch-depth: 0 lives INSIDE the action, not here -- a shallow clone makes the
# range scan pass vacuously. The action also runs a decoy canary on every
# invocation, so a green result proves the detector was alive rather than silent.

on:
  pull_request:
  push:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: nonagenticai/gitops-production/.github/actions/secret-scan@main
