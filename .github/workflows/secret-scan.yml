name: Secret scan

# ═══════════════════════════════════════════════════════════════════════════
# WHY THIS FILE IS VENDORED INLINE AND NOT `uses:` THE FLEET ACTION
# ═══════════════════════════════════════════════════════════════════════════
# This repo is a PUBLIC FORK of mlx-graphs/mlx-graphs. Two previous
# attempts to add this gate (PR #14 `feat/secret-scan-gate`, PR #17
# `ci/secret-scan-coverage`) both used:
#
#     uses: nonagenticai/gitops-production/.github/actions/secret-scan@main
#
# and BOTH died at step 0 — during "Prepare all required actions", before
# checkout ever ran — with:
#
#     ##[error]Unable to resolve action `nonagenticai/gitops-production`, not found
#
# (mlx-graphs run 32714797312, 2026-08-24; identical error in mlx-image run
# 32714794820, head d62a1fa.) The cause is not a
# typo and not a missing branch: `gitops-production` is PRIVATE, and the
# GITHUB_TOKEN handed to a workflow in a public fork has no read access to it.
# The action can therefore NEVER resolve here, on any runner, with any
# permissions block. Re-adding that `uses:` reproduces the failure exactly.
#
# So the scanner is vendored: gitleaks' rules live in `.gitleaks.toml` at the
# repo root, and the binary is fetched from the scanner's own PUBLIC GitHub
# release. Nothing in this file reads a private repo, and nothing needs a
# secret — so it runs identically for a fork, for Dependabot, and for a PR from
# an outside contributor, all of which get a read-only token and no secrets.
#
# ── REJECTED: gitleaks/gitleaks-action ─────────────────────────────────────
# The obvious "use the public action" answer does not work here. Since v2 that
# action requires a `GITLEAKS_LICENSE` secret for repositories owned by an
# ORGANIZATION (nonagenticai is one; it is free for personal accounts only).
# Secrets are NOT exposed to `pull_request` runs from a fork, so the action
# would fail — or worse, degrade — on precisely the events this gate exists to
# police. A security gate must not depend on a secret it cannot be given, nor
# on a third-party licence server being up. The gitleaks CLI itself is MIT and
# carries no such condition, so we use the CLI directly.
#
# ── REJECTED: detect-secrets in CI ─────────────────────────────────────────
# `.secrets.baseline` + the pre-commit hook already run detect-secrets locally,
# and it needs no external action at all, so it was a genuine candidate. It was
# not chosen because the other ~154 repos in the fleet are gated by GITLEAKS.
# Running a different detector here would give this repo a different verdict
# from every other repo for the same pasted credential, and detect-secrets'
# keyword/entropy detectors cannot see a credential passed as a bare ARGUMENT
# — which is exactly what `nonagentic-licenses-token` in `.gitleaks.toml` is
# built to catch. The baseline is still fixed in this same commit, because the
# local hook was inert (see the commit message); the two gates are complements,
# not alternatives.
#
# runs-on: ubuntu-latest, NOT a self-hosted label. The org's self-hosted runner
# groups set allows_public_repositories=false (correct posture), so a public
# fork's jobs queue on those labels forever. Same reason ci.yaml says so.
#
# ⛔ NO `if:` ON THE JOB, no `continue-on-error`, no `|| true`. A conditional or
# a soft-fail on a security gate is how a scan becomes permanently inert while
# still reporting green.

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a full commit SHA, not a tag: a tag is mutable and an
      # unpinned action inside a security gate is its own defect.
      # de0fac2 == v6.0.2.
      #
      # fetch-depth: 0 is load-bearing. With the default shallow clone the scan
      # range cannot resolve, gitleaks scans 0 commits, prints "no leaks found"
      # and exits 0 — a scanner that scans nothing passes beautifully.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned + sha256-verified)
        run: |
          set -euo pipefail
          # 8.30.1, the same version the fleet action pins. NOT 8.21.x: there,
          # --redact BREAKS baseline suppression because the baseline stores the
          # real Match/Secret and --redact overwrites them before comparison.
          # Dropping --redact instead is not an option — it would print a live
          # credential into a public CI log.
          GL_VERSION=8.30.1
          GL_ASSET=linux_x64
          # From the release's own gitleaks_8.30.1_checksums.txt.
          GL_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_${GL_ASSET}.tar.gz"
          dest="${RUNNER_TEMP:-/tmp}"
          # --retry-all-errors: plain --retry ignores mid-transfer connection
          # resets (curl exit 35/56), which is how these downloads actually fail.
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 20 \
            -o "${dest}/gitleaks.tar.gz" "$url"
          echo "${GL_SHA256}  ${dest}/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "${dest}/gl" "${dest}/bin"
          tar -xzf "${dest}/gitleaks.tar.gz" -C "${dest}/gl"
          install -m 0755 "${dest}/gl/gitleaks" "${dest}/bin/gitleaks"
          echo "${dest}/bin" >> "$GITHUB_PATH"
          "${dest}/bin/gitleaks" version

      - name: Confirm the vendored config is present
        run: |
          set -euo pipefail
          # Without it gitleaks silently falls back to its DEFAULT ruleset, which
          # does not contain `nonagentic-licenses-token` — a green run with the
          # one rule that matters switched off. Fail closed instead.
          if [ ! -f .gitleaks.toml ]; then
            echo "::error::.gitleaks.toml is missing from the repo root. Refusing to scan with gitleaks' default rules."
            exit 1
          fi

      - name: Canary — prove the detector is actually alive
        run: |
          set -euo pipefail
          # The cheapest defence against "the scanner ran and found nothing
          # because it was broken". In ~1s this proves the binary runs, the
          # config parses, the rules compile, and a finding really does produce
          # a non-zero exit. Without it, a config typo that disables every rule
          # is indistinguishable from a clean repo.
          #
          # OUTSIDE the worktree, deliberately: a decoy written into the tree
          # would be picked up by the real scan and manufacture a finding.
          canary="${RUNNER_TEMP:-/tmp}/canary"
          mkdir -p "$canary"
          # A FIXED, pre-verified decoy — 43 base64url chars, entropy 5.287,
          # confirmed to trip `nonagentic-licenses-token` on 8.30.1. Fixed and
          # not freshly minted: a gate must be deterministic.
          #
          # SPLIT across two shell literals on purpose. Written whole, this file
          # would itself contain a live-shaped 43-char token and the gate would
          # flag its own workflow on any PR that touches it. Do not "tidy" this
          # into one string.
          _d1='Xq7-Zm2_Kt9Rb4Nv6Ws1Yc8Pf3Hj5Ld0'
          _d2='Ge-Ao_Iu2Qz'
          printf 'do_post canary %s%s\n' "$_d1" "$_d2" > "$canary/decoy.sh"
          set +e
          gitleaks detect --source "$canary" --config=.gitleaks.toml \
            --no-git --redact --verbose > "${RUNNER_TEMP:-/tmp}/canary.log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::CANARY FAILED — gitleaks did not flag a planted licence-shaped token. The rules are not loading, so a clean result from the real scan below would be meaningless. Failing closed."
            cat "${RUNNER_TEMP:-/tmp}/canary.log"
            exit 1
          fi
          if ! grep -q 'nonagentic-licenses-token' "${RUNNER_TEMP:-/tmp}/canary.log"; then
            echo "::error::CANARY FAILED — something fired, but not the nonagentic-licenses-token rule. Failing closed."
            cat "${RUNNER_TEMP:-/tmp}/canary.log"
            exit 1
          fi
          rm -rf "$canary"
          echo "canary OK: a planted licence-shaped token was detected by nonagentic-licenses-token."

      - name: Resolve the scan range (anti-vacuity)
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # A RANGE scan, not a full-repo scan: gitleaks in git mode judges the
          # DIFF, so this only ever sees lines an event ADDS. Pre-existing
          # findings (this repo's tutorial notebooks carry base64 plot output)
          # stay invisible and no per-repo baseline is needed to reach green. A
          # gate that is red on arrival is switched off within a day.
          #
          # ⛔ EVERY event must yield a real range or FAIL. There is deliberately
          # no silent-skip branch: "handle the PR case and skip the rest" leaves
          # push and dispatch unscanned while the badge still says green.
          zero='^0*$'
          case "$EVENT_NAME" in
            pull_request|pull_request_target)
              [ -n "$PR_BASE_SHA" ] && [ -n "$PR_HEAD_SHA" ] || {
                echo "::error::pull_request event with no base/head sha in the payload — cannot build a range."; exit 1; }
              RANGE="${PR_BASE_SHA}..${PR_HEAD_SHA}"
              ;;
            push)
              if [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ $zero ]] \
                   && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                RANGE="${PUSH_BEFORE}..${PUSH_AFTER}"
              elif [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ $zero ]]; then
                # `before` is a real sha that is NOT in this clone. This is NOT a
                # shallow checkout (fetch-depth: 0 is set above) — a force-push
                # ORPHANED it, and an orphaned commit is unreachable from every
                # ref, so no fetch depth can ever retrieve it. Failing closed
                # would be safe but wrong: force-pushing a PR branch is normal,
                # and a permanently red gate on a legitimate operation is how a
                # security check gets ignored. Resolve a real range and say what
                # was lost.
                base=""
                if [ -n "${DEFAULT_BRANCH:-}" ] \
                     && git cat-file -e "origin/${DEFAULT_BRANCH}^{commit}" 2>/dev/null; then
                  base="$(git merge-base "origin/${DEFAULT_BRANCH}" "$PUSH_AFTER" 2>/dev/null || true)"
                fi
                if [ -n "$base" ] && [ "$base" != "$PUSH_AFTER" ]; then
                  # Rescans the WHOLE branch: strictly MORE coverage than
                  # before..after, never less, so this cannot hide a leak.
                  RANGE="${base}..${PUSH_AFTER}"
                  echo "::warning::push 'before' (${PUSH_BEFORE}) is unreachable (force-push orphan). Falling back to merge-base(origin/${DEFAULT_BRANCH})..${PUSH_AFTER}, which rescans the entire branch."
                else
                  RANGE="${PUSH_AFTER}~1..${PUSH_AFTER}"
                  git cat-file -e "${PUSH_AFTER}~1^{commit}" 2>/dev/null || RANGE="${PUSH_AFTER}"
                  echo "::warning::push 'before' (${PUSH_BEFORE}) is unreachable AND no merge-base with the default branch is available. Falling back to the tip commit only — COVERAGE IS REDUCED for this run."
                fi
              else
                # New branch/tag: `before` is all zeros.
                RANGE="${PUSH_AFTER}~1..${PUSH_AFTER}"
                git cat-file -e "${PUSH_AFTER}~1^{commit}" 2>/dev/null || RANGE="${PUSH_AFTER}"
              fi
              ;;
            *)
              # workflow_dispatch, schedule, … There is no "what changed" for
              # these, so scan the tip: a real, non-empty, deterministic range.
              RANGE="HEAD~1..HEAD"
              git cat-file -e "HEAD~1^{commit}" 2>/dev/null || RANGE="HEAD"
              ;;
          esac
          echo "range=${RANGE}" >> "$GITHUB_OUTPUT"
          echo "resolved range for ${EVENT_NAME}: ${RANGE}"

          for sha in $(echo "$RANGE" | tr '.' ' '); do
            [ -n "$sha" ] || continue
            git cat-file -e "${sha}^{commit}" 2>/dev/null || {
              echo "::error::commit $sha is not present locally, so gitleaks would scan 0 commits and pass vacuously."; exit 1; }
          done

          n="$(git rev-list --count --no-merges "$RANGE")"
          echo "commits in range: $n"
          if [ "$n" -eq 0 ]; then
            echo "::error::the resolved range contains 0 commits. gitleaks would report 'no leaks found' having scanned nothing. Refusing to report a vacuous pass."
            exit 1
          fi
          echo "count=${n}" >> "$GITHUB_OUTPUT"

      - name: gitleaks — scan the commits this event adds
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          # --redact: never print a live credential into a CI log. This repo is
          # PUBLIC, so that log is world-readable.
          #
          # `-m` is load-bearing: `git log -p` emits NO diff for merge commits,
          # so a credential pasted while resolving a conflict is invisible
          # without it and passes every vacuity floor.
          #
          # Output goes OUTSIDE the worktree ($RUNNER_TEMP): a log written
          # inside the scanned tree gets picked up and manufactures findings.
          log="${RUNNER_TEMP:-/tmp}/gitleaks.log"
          set +e
          gitleaks detect \
            --source . \
            --config=.gitleaks.toml \
            --log-opts "${RANGE} -m" \
            --redact \
            --verbose 2>&1 | tee "$log"
          rc="${PIPESTATUS[0]}"
          set -e

          # SECOND anti-vacuity floor, independent of the range check. gitleaks
          # reports its own scanned volume; "scanned ~0 bytes" with a clean exit
          # is exactly how a broken invocation passes. Gated on ADDED LINES, not
          # commits: a deletion-only change legitimately scans ~0 bytes and must
          # not be a false red. `^+[^+]` excludes the `+++` file headers.
          # `|| added=0`, not `|| true`: grep exits 1 on a zero count.
          added="$(git log -p -m --no-color "$RANGE" | grep -c '^+[^+]')" || added=0
          echo "lines added in range: ${added}"
          if [ "${added:-0}" -gt 0 ] && grep -qE 'scanned ~0 bytes' "$log"; then
            echo "::error::this range adds ${added} line(s) but gitleaks scanned ~0 bytes. This pass is vacuous. Refusing to report success."
            exit 1
          fi
          if [ "${added:-0}" -gt 0 ] && ! grep -qE 'scanned ~' "$log"; then
            echo "::error::gitleaks printed no 'scanned ~N bytes' line — output format changed, so the anti-vacuity floor can no longer be evaluated. Failing closed."
            exit 1
          fi

          # The gate. No `|| true`, no `continue-on-error`: a finding fails the
          # build.
          exit "$rc"

      - name: Result
        run: |
          echo "gitleaks scanned ${{ steps.range.outputs.count }} commit(s) with the vendored .gitleaks.toml and found no secrets."
