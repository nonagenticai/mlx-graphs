name: Secret scan

# Added 2026-08-17. This repo had NO secret scanning of any kind, and neither
# does anything behind it: org-level GitHub secret scanning and push protection
# are both DISABLED (`gh api orgs/nonagenticai` -> both false) and branch
# protection is unavailable on this plan. A credential pushed here was caught by
# nothing at all.
#
# It is not wired to a CI archetype, so the fleet gate in
# nonagenticai/gitops-production cannot reach it by any archetype change. This
# file is the whole wiring: the composite action does its own checkout with
# fetch-depth: 0 and takes no inputs.
#
# The scan is a RANGE scan -- it judges only the lines an event ADDS, so
# pre-existing findings never block it and no per-repo baseline is needed.
on:
  pull_request:
  push:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    # NO `if:` on this job, deliberately -- `if: false` is the mutation that
    # survives every other check on a security gate.
    name: Secret scan (gitleaks)
    runs-on: arc-amd64
    timeout-minutes: 10
    steps:
      - uses: nonagenticai/gitops-production/.github/actions/secret-scan@main
