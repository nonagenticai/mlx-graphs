name: Tests

# ADDED 2026-08-19. This repo had a real test suite and CI ran NONE of it.
# 11 of 89 python repos across the fleet were in that state -- 383 test files
# unexercised, recorded as M15 in gitops-production
# docs/open-findings-2026-08-18.md. It is not neglect: MLX only installs on
# Apple Silicon, so the Linux archetypes cannot run these. It still means main
# can be green while the suite is red, which is exactly what was found in
# mlx_backend (5 failures, 4 months old) and mlx_ingestion_backend (32).
#
# PUBLIC repo, so GitHub-hosted macOS is FREE and the self-hosted pool refuses it (allows_public_repositories=false). NB --extra test, not --all-extras: the random-walk extra pulls mlx-cluster, which fails to resolve and leaves the venv incomplete.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: uv sync --extra test

      - name: Pytest
        # Single run, teed -- the floor below reads THIS result rather than
        # invoking pytest a second time. The old form ran `--collect-only`
        # again, which doubled the job AND tripped the coverage gate (a
        # collect-only pass executes nothing, so coverage reads ~20%).
        run: |
          set -euo pipefail
          uv run pytest tests/ -q | tee /tmp/pytest-out.txt

      - name: Assert the suite is not vacuous
        # pytest exits 5 on an empty suite, and a collection error that gathered
        # nothing must not read as a pass.
        #
        # Parse "N passed" from the real run. The previous version grepped
        # `^[0-9]+` against the last line of --collect-only, but that line is
        # `===== 400 tests collected in 0.28s =====` -- the count is NOT at the
        # start, so it always extracted nothing and reported `collected 0`,
        # failing every repo whose summary carries a coverage banner.
        run: |
          set -euo pipefail
          n=$(grep -oE '[0-9]+ passed' /tmp/pytest-out.txt | grep -oE '^[0-9]+' | tail -1 || echo 0)
          echo "passed ${n} tests"
          if [ "${n:-0}" -lt 140 ]; then
            echo "::error::expected >=140 passing tests, saw ${n}. A shrinking suite is a silent loss of coverage."
            exit 1
          fi
