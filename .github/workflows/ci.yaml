# CI for mlx-graphs (external repo, Apple-Silicon-only)
#
# Runs on the org's self-hosted macOS arm64 runner (mini2-darwin, labels
# self-hosted/macOS/ARM64/darwin/mlx). MLX requires Apple Silicon, and this
# runner is the only place mlx wheels actually install + import.
# Type checking is skipped (see [tool.local-ci] skip_ty in pyproject.toml).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_HTTP_TIMEOUT: 300

jobs:
  lint-and-security:
    name: Lint & Security
    runs-on: [self-hosted, macOS, ARM64, mlx]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install security tools
        run: uv pip install bandit pip-audit

      - name: Run ruff linter (check only)
        run: uv run ruff check mlx_graphs/ tests/

      - name: Run ruff formatter (check only)
        run: uv run ruff format --check mlx_graphs/ tests/

      # bandit findings in upstream code are tracked but non-blocking —
      # external repo, see [tool.local-ci] skip_ty rationale in pyproject.toml.
      - name: Security scan - bandit
        continue-on-error: true
        run: uv run bandit -r mlx_graphs/ -ll -ii

      - name: Security scan - pip-audit
        run: uv run pip-audit --skip-editable
